<!doctype html>
<!--
  cursor-scene1 — sub-composition: arrow cursor that appears, travels to the ChatGPT icon,
  arcs, and presses (track 8 of index.html). All motion is GSAP transforms relative to the
  base position (left 733, top 382).
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #root img {
          position: absolute;
          left: 733px;
          top: 382px;
          width: 46.78px;
          height: 73.9px;
          display: block;
          transform-origin: 50% 50%;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="cursor-scene1" data-width="1512" data-height="672">
        <img id="cursor" src="assets/icons/cursor.svg" alt="" />
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        const cursor = document.getElementById("cursor");

        // Appear.
        tl.fromTo(
          cursor,
          { opacity: 0, scale: 0.8, x: 6, y: 10 },
          { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false },
          15.52,
        );

        // Travel to the ChatGPT icon (ends at left 1287).
        tl.fromTo(cursor, { x: 0 }, { x: 554, duration: 0.97, ease: "power2.inOut", immediateRender: false }, 15.85);

        // Arc (up, then back down).
        tl.fromTo(cursor, { y: 0 }, { y: -12, duration: 0.33, ease: "power1.inOut", immediateRender: false }, 15.97);
        tl.fromTo(cursor, { y: -12 }, { y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 16.4);

        // Click press.
        tl.fromTo(cursor, { scale: 1 }, { scale: 0.9, duration: 0.15, ease: "power1.out", immediateRender: false }, 16.85);
        tl.fromTo(cursor, { scale: 0.9 }, { scale: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, 17.0);

        window.__timelines["cursor-scene1"] = tl;
      </script>
    </template>
  </body>
</html>
