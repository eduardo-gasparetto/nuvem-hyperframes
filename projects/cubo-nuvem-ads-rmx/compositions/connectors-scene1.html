<!doctype html>
<!--
  connectors-scene1 — sub-composition: four straight connector lines from the social icons
  to the site mockup edges (track 5 of index.html). Each line grows from its start point
  (inside the icon circle) to its end point (on the mockup edge). Lines stay after growing.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #root svg {
          position: absolute;
          left: 0;
          top: 0;
          display: block;
        }
        #root line {
          stroke: #ffffff;
          stroke-width: 3;
          stroke-linecap: butt;
          fill: none;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="connectors-scene1" data-width="1512" data-height="672">
        <svg width="1512" height="672" viewBox="0 0 1512 672">
          <line id="line-whatsapp" x1="268.0" y1="216.5" x2="268.0" y2="216.5" />
          <line id="line-tiktok" x1="256.0" y1="539.3" x2="256.0" y2="539.3" />
          <line id="line-instagram" x1="1222.0" y1="180.1" x2="1222.0" y2="180.1" />
          <line id="line-google" x1="1262.0" y1="519.8" x2="1262.0" y2="519.8" />
        </svg>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // [element, end x, end y, start time, duration]
        const lines = [
          { id: "line-whatsapp", x1: 268.0, y1: 216.5, x2: 372.0, y2: 240.6, start: 5.7, dur: 0.173 },
          { id: "line-tiktok", x1: 256.0, y1: 539.3, x2: 372.0, y2: 496.0, start: 5.745, dur: 0.15 },
          { id: "line-instagram", x1: 1222.0, y1: 180.1, x2: 1140.0, y2: 219.4, start: 5.825, dur: 0.114 },
          { id: "line-google", x1: 1262.0, y1: 519.8, x2: 1140.0, y2: 473.6, start: 5.737, dur: 0.163 },
        ];

        lines.forEach((l) => {
          const el = document.getElementById(l.id);
          // Grow: end point from the start point to the final point, linear.
          tl.fromTo(
            el,
            { attr: { x2: l.x1, y2: l.y1 } },
            { attr: { x2: l.x2, y2: l.y2 }, duration: l.dur, ease: "none", immediateRender: false },
            l.start,
          );
          // Reveal: opacity 0 -> 0.2 at the start time (tiny tween, reversible on seek).
          tl.fromTo(el, { opacity: 0 }, { opacity: 0.2, duration: 0.001, ease: "none", immediateRender: false }, l.start);
        });

        // Scene exit and re-entry: each end follows the element it is attached to.
        // y1 (icon end) follows the icons layer; y2 (mockup end) follows the mockup layer.
        lines.forEach((l) => {
          const el = document.getElementById(l.id);
          tl.to(
            el,
            { attr: { y1: l.y1 + 1440, y2: l.y2 + 1440 }, duration: 0.88, ease: "power2.in", immediateRender: false },
            10.15,
          );
          tl.fromTo(
            el,
            { attr: { y1: l.y1 + 820 } },
            { attr: { y1: l.y1 }, duration: 1.34, ease: "power3.out", immediateRender: false },
            13.51,
          );
          tl.fromTo(
            el,
            { attr: { y2: l.y2 + 640 } },
            { attr: { y2: l.y2 }, duration: 1.0, ease: "power2.out", immediateRender: false },
            13.61,
          );
        });

        // Retract toward each icon (end point back to the start point), then hide.
        const retract = [
          { id: "line-instagram", start: 17.17, dur: 0.1, ease: "none" },
          { id: "line-google", start: 17.2, dur: 0.22, ease: "power1.inOut" },
          { id: "line-tiktok", start: 17.19, dur: 0.22, ease: "power1.inOut" },
          { id: "line-whatsapp", start: 17.22, dur: 0.25, ease: "power1.inOut" },
        ];
        retract.forEach((r) => {
          const l = lines.find((ln) => ln.id === r.id);
          const el = document.getElementById(r.id);
          tl.fromTo(
            el,
            { attr: { x2: l.x2, y2: l.y2 } },
            { attr: { x2: l.x1, y2: l.y1 }, duration: r.dur, ease: r.ease, immediateRender: false },
            r.start,
          );
          tl.fromTo(el, { opacity: 0.2 }, { opacity: 0, duration: 0.001, ease: "none", immediateRender: false }, r.start + r.dur);
        });

        window.__timelines["connectors-scene1"] = tl;
      </script>
    </template>
  </body>
</html>
