<!doctype html>
<!--
  cubo-nuvem-ads-rmx — HyperFrames
  ─────────────────────────────────────────────────────────────────────
  Recreation of the 64s ad. Canvas 1512×672, 30 fps, 10 s.
  Root composition: mounts two sub-compositions.
    track 0 → compositions/bg.html          (blue gradient background)
    track 1 → compositions/propagation.html (isologo base + expanding rings)
  ─────────────────────────────────────────────────────────────────────
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1512, height=672" />

    <link rel="stylesheet" href="shared/fonts.css" />
    <link rel="stylesheet" href="shared/nuvem-tokens.css" />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1512px;
        height: 672px;
        overflow: hidden;
        background: #010b23;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        left: 0;
        top: 0;
        width: 1512px;
        height: 672px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="23"
      data-width="1512"
      data-height="672"
    >
      <!-- track 0: background sub-composition -->
      <div
        id="bg-layer"
        class="clip"
        data-composition-id="bg"
        data-composition-src="compositions/bg.html"
        data-start="0"
        data-duration="23"
        data-track-index="0"
        data-width="1512"
        data-height="672"
      ></div>

      <!-- track 1: propagation sub-composition -->
      <div
        id="propagation-layer"
        class="clip"
        data-composition-id="propagation"
        data-composition-src="compositions/propagation.html"
        data-start="0"
        data-duration="23"
        data-track-index="1"
        data-width="1512"
        data-height="672"
      ></div>

      <!-- track 2: scene-1 titles sub-composition -->
      <div
        id="titles-scene1-layer"
        class="clip"
        data-composition-id="titles-scene1"
        data-composition-src="compositions/titles-scene1.html"
        data-start="0"
        data-duration="23"
        data-track-index="2"
        data-width="1512"
        data-height="672"
      ></div>

      <!-- track 9: "7 em 10" statistic sub-composition -->
      <div
        id="stat-scene-layer"
        class="clip"
        data-composition-id="stat-scene"
        data-composition-src="compositions/stat-scene.html"
        data-start="0"
        data-duration="23"
        data-track-index="9"
        data-width="1512"
        data-height="672"
      ></div>

      <!-- track 5: connector lines sub-composition -->
      <div
        id="connectors-scene1-layer"
        class="clip"
        data-composition-id="connectors-scene1"
        data-composition-src="compositions/connectors-scene1.html"
        data-start="0"
        data-duration="23"
        data-track-index="5"
        data-width="1512"
        data-height="672"
      ></div>

      <!-- track 4: social icons + avatars sub-composition -->
      <div
        id="icons-scene1-layer"
        class="clip"
        data-composition-id="icons-scene1"
        data-composition-src="compositions/icons-scene1.html"
        data-start="0"
        data-duration="23"
        data-track-index="4"
        data-width="1512"
        data-height="672"
      ></div>

      <!-- track 7: ChatGPT icon, avatar and connector (not translated) -->
      <div
        id="gpt-scene1-layer"
        class="clip"
        data-composition-id="gpt-scene1"
        data-composition-src="compositions/gpt-scene1.html"
        data-start="0"
        data-duration="23"
        data-track-index="7"
        data-width="1512"
        data-height="672"
      ></div>

      <!-- track 6: site mockup sub-composition -->
      <div
        id="mockup-scene1-layer"
        class="clip"
        data-composition-id="mockup-scene1"
        data-composition-src="compositions/mockup-scene1.html"
        data-start="0"
        data-duration="23"
        data-track-index="6"
        data-width="1512"
        data-height="672"
      ></div>

      <!-- track 8: arrow cursor sub-composition -->
      <div
        id="cursor-scene1-layer"
        class="clip"
        data-composition-id="cursor-scene1"
        data-composition-src="compositions/cursor-scene1.html"
        data-start="0"
        data-duration="23"
        data-track-index="8"
        data-width="1512"
        data-height="672"
      ></div>

      <!-- track 3: "Anúncios Integrados" pill sub-composition (on top) -->
      <div
        id="pill-layer"
        class="clip"
        data-composition-id="pill"
        data-composition-src="compositions/pill.html"
        data-start="0"
        data-duration="23"
        data-track-index="3"
        data-width="1512"
        data-height="672"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Scene exit: icons and mockup layers fall together.
      tl.to("#icons-scene1-layer", { y: 1440, duration: 0.88, ease: "power2.in", immediateRender: false }, 10.15);
      tl.to("#mockup-scene1-layer", { y: 1440, duration: 0.88, ease: "power2.in", immediateRender: false }, 10.15);

      // Re-entry: mockup layer rises, then the icons layer.
      tl.fromTo("#mockup-scene1-layer", { y: 640 }, { y: 0, duration: 1.0, ease: "power2.out", immediateRender: false }, 13.61);
      tl.fromTo("#icons-scene1-layer", { y: 820 }, { y: 0, duration: 1.34, ease: "power3.out", immediateRender: false }, 13.51);

      // Final scene exit at 18.68: mockup, ChatGPT and cursor layers fall (same curve as the first exit).
      tl.fromTo("#mockup-scene1-layer", { y: 0 }, { y: 1440, duration: 0.88, ease: "power2.in", immediateRender: false }, 18.68);
      tl.fromTo("#gpt-scene1-layer", { y: 0 }, { y: 1440, duration: 0.88, ease: "power2.in", immediateRender: false }, 18.68);
      tl.fromTo("#cursor-scene1-layer", { y: 0 }, { y: 1440, duration: 0.88, ease: "power2.in", immediateRender: false }, 18.68);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
