<!doctype html>
<!--
  scene-1 — "Você esteve no D2C Summit e não conseguiu participar dos workshops presenciais?"
  Figma "Instagram story - 5". Local time = absolute time (host starts at 0).
  Voice vo-s1 starts at 0.45; word starts come from the whisper transcript (transcripts/vo-s1.json) + 0.45.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Plus Jakarta Sans';
          font-style: normal;
          font-weight: 400 600;
          font-display: swap;
          src: url('shared/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s1-photo {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          opacity: 0.3;
        }
        #s1-video {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          object-fit: cover;
        }
        #s1-text {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
        }
        .s1-line {
          position: absolute;
          width: 906px;
          font-family: 'Plus Jakarta Sans', sans-serif;
          font-weight: 600;
          font-size: 66px;
          letter-spacing: -0.165px;
          color: #ffffff;
          text-align: left;
        }
        #s1-line-a {
          left: 91px;
          top: 1216px;
          line-height: 1.234;
        }
        #s1-line-b {
          left: 82px;
          top: 1397.8px;
          line-height: 1.3;
        }
        .s1-line .w {
          display: inline-block;
          opacity: 0;
        }
        #s1-isologo {
          position: absolute;
          left: 90px;
          top: 1311px;
          width: 227.546px;
          height: 77.924px;
          opacity: 0;
        }
        #s1-wordmark {
          position: absolute;
          left: 352.3px;
          top: 1322.6px;
          width: 377.86px;
          height: 54.409px;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="scene-1" data-width="1080" data-height="1920">
        <div id="s1-photo">
          <video
            id="s1-video"
            class="clip"
            src="assets/gemini/s1-slow.mp4"
            data-start="0"
            data-duration="6.9"
            data-track-index="0"
            muted
            playsinline
          ></video>
        </div>
        <div id="s1-text">
          <div id="s1-line-a" class="s1-line">Você esteve no</div>
          <img id="s1-isologo" src="assets/img/d2c-isologo.svg" alt="" />
          <img id="s1-wordmark" src="assets/img/d2c-type.svg" alt="" />
          <div id="s1-line-b" class="s1-line">e não conseguiu participar dos workshops presenciais?</div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        NuvemMotion.setCanvas(1920);

        function splitWords(el) {
          const words = el.textContent.trim().split(/\s+/);
          el.textContent = "";
          words.forEach((w, i) => {
            if (i) el.appendChild(document.createTextNode(" "));
            const s = document.createElement("span");
            s.className = "w";
            s.textContent = w;
            el.appendChild(s);
          });
          return Array.from(el.querySelectorAll(".w"));
        }

        const VO = 0.45; // vo-s1 start
        // Word starts = VO + transcript start (Você 0.20, esteve 0.44, no 0.96).
        const lineA = splitWords(document.getElementById("s1-line-a"));
        NuvemMotion.wordsIn(tl, lineA, [VO + 0.2, VO + 0.44, VO + 0.96]);

        // "D2C" (transcript Dítio 1.13) pops the isologo; "Summit" (1.81) brings the wordmark.
        NuvemMotion.wordsIn(tl, [document.getElementById("s1-isologo")], VO + 1.13);
        NuvemMotion.wordsIn(tl, [document.getElementById("s1-wordmark")], VO + 1.81);

        // Line B: e 2.25, não 2.35, conseguiu 2.58, participar 3.12, dos 3.66, workshops 3.76, presenciais 4.37.
        const lineB = splitWords(document.getElementById("s1-line-b"));
        NuvemMotion.wordsIn(
          tl,
          lineB,
          [2.25, 2.35, 2.58, 3.12, 3.66, 3.76, 4.37].map((t) => VO + t)
        );

        // Exit: text fades (P2) so it is gone at the end of the voice (5.85), then the photo falls (P7).
        NuvemMotion.textOut(tl, "#s1-text", 5.52);
        NuvemMotion.sceneFall(tl, "#s1-photo", 6.0);

        window.__timelines["scene-1"] = tl;
      </script>
    </template>
  </body>
</html>
