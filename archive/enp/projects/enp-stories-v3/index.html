<!DOCTYPE html>
<!--
  EnP Stories v3 — HyperFrames
  ─────────────────────────────────────────────────────────────────────
  Canvas: 1080×1920 (Instagram Stories / Reels)

  Arquitetura: wrapper único como clip
  ─ Video de fundo com overlay azul #1076DD (90% opacidade)
  ─ Logo e content-block são os únicos clips
  ─ Dentro do content-block: flex normal (título, subtítulo, CTA fluem juntos)
  ─ Trocar o texto do título reposiciona subtítulo e CTA automaticamente
  ─────────────────────────────────────────────────────────────────────
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">

    <link rel="stylesheet" href="shared/fonts.css">
    <link rel="stylesheet" href="shared/enp-tokens.css">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: var(--enp-font);
        color: var(--enp-text);
      }

      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        background: linear-gradient(180deg, #FFFFFF 0%, #F4F7FB 45%, #EBF3FD 100%);
      }

      /* ─── Background Video & Overlay ─── */
      #bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        z-index: 1;
      }

      #bg-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        background-color: #1076DD;
        opacity: 0.9;
        z-index: 2;
        transform-origin: bottom;
      }

      /* ─── Logo — clip isolado ─── */
      #logo {
        position: absolute;
        top: 533px;
        left: 80px;
        width: 320px;
        height: auto;
        z-index: 3;
      }

      /* ─── Content block — único clip, flex interno ───
         position: absolute posiciona o bloco no canvas.
         O flex dentro flui normalmente — sem clips filhos. */
      #content {
        position: absolute;
        top: 713px;
        left: 80px;
        width: 920px;
        display: flex;
        flex-direction: column;
        gap: 48px;
        z-index: 3;
      }

      #title {
        font-size: 80px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.15;
        color: #FFFFFF;
      }

      #subtitle {
        font-size: 42px;
        font-weight: 400;
        line-height: 1.6;
        color: #FFFFFF;
      }

      #cta {
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        margin-top: 40px;
        background: #CDFF07;
        color: #0D1B2E;
        font-size: 38px;
        font-weight: 600;
        padding: 44px 80px;
        border-radius: var(--enp-radius-pill);
      }
    </style>
  </head>

  <body>
    <div data-hf-id="hf-root" id="root" data-enp-theme="dark" data-composition-id="enp-stories-v3" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <!-- Fundo de vídeo e overlay -->
      <video data-hf-id="hf-bg-video" id="bg-video" class="clip" data-start="0" data-duration="13" data-track-index="0" src="gemini-export-pvoiV6OEejiRXynvF5Cy.mp4" muted playsinline autoplay loop></video>
      <div data-hf-id="hf-bg-overlay" id="bg-overlay" class="clip" data-start="0" data-duration="13" data-track-index="3"></div>

      <img data-hf-id="hf-logo" id="logo" class="clip" data-start="0" data-duration="13" data-track-index="1" src="shared/assets/logo-branco-ecommerce-na-pratica.svg" alt="Ecommerce na Prática">

      <!-- Wrapper único — o único clip do bloco de conteúdo -->
      <div data-hf-id="hf-content" id="content" class="clip" data-start="0" data-duration="13" data-track-index="2">
        <h1 data-hf-id="hf-cssn" id="title">Cada fase da sua loja tem um passo claro</h1>

        <p data-hf-id="hf-t4ml" id="subtitle">Conteúdos estruturados em trilhas conectadas ao seu momento.<span data-hf-id="hf-zbgx" style="display: block; margin-top: 39px;">Do primeiro produto até sua loja vendendo todo dia, sem perder tempo.</span></p>

        <div data-hf-id="hf-gegd" id="cta">Comece agora</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Inicializa o overlay como 0 na base
      tl.set("#bg-overlay", { scaleY: 0 });

      // Transição do overlay: cresce saindo de zero na base até 100% (2.0s a 2.5s)
      tl.to("#bg-overlay", { scaleY: 1, duration: 0.785, ease: "power2.out" }, 1.715);

      // Entrada em cascata — logo → título → subtítulo → CTA (após a transição completar aos 2.5s)
      tl.from("#logo",     { opacity: 0, y: -24, duration: 0.5, ease: "power3.out" }, 2.5);
      tl.from("#title",    { opacity: 0, y: 40,  duration: 0.6, ease: "power3.out" }, 2.9);
      tl.from("#subtitle", { opacity: 0, y: 24,  duration: 0.5, ease: "power2.out" }, 3.3);
      tl.from("#cta",      { opacity: 0, scale: 0.9, duration: 0.4, ease: "back.out(1.7)" }, 3.8);

      // A partir de 4.5 segundos, fadein do overlay para 100% de opacidade durando 2 segundos
      tl.to("#bg-overlay", { opacity: 1.0, duration: 2.0, ease: "power2.inOut" }, 4.5);

      // Pulsos discretos e contínuos no CTA (entre 1.00 e 1.04) a partir de 6.5s até o final do vídeo (13s)
      let pulseTime = 6.5;
      while (pulseTime < 13.0) {
        tl.to("#cta", { scale: 1.04, duration: 0.4, ease: "sine.inOut" }, pulseTime);
        tl.to("#cta", { scale: 1.00, duration: 0.4, ease: "sine.inOut" }, pulseTime + 0.4);
        pulseTime += 0.8;
      }

      window.__timelines["enp-stories-v3"] = tl;
    </script>
  </body>
</html>
