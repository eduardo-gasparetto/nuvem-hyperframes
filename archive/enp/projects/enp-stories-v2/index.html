<!DOCTYPE html>
<!--
  EnP Stories v2 — HyperFrames
  ─────────────────────────────────────────────────────────────────────
  Canvas: 1080×1920 (Instagram Stories / Reels)

  Arquitetura: wrapper único como clip
  ─ Logo e content-block são os únicos clips
  ─ Dentro do content-block: flex normal (título, subtítulo, CTA fluem juntos)
  ─ Trocar o texto do título reposiciona subtítulo e CTA automaticamente
  ─────────────────────────────────────────────────────────────────────
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">

    <link rel="stylesheet" href="shared/fonts.css">
    <link rel="stylesheet" href="shared/enp-tokens.css">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: var(--enp-font);
        color: var(--enp-text);
      }

      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        background: linear-gradient(180deg, #FFFFFF 0%, #F4F7FB 45%, #EBF3FD 100%);
      }

      /* ─── Logo — clip isolado ─── */
      #logo {
        position: absolute;
        top: 433px;
        left: 80px;
        width: 320px;
        height: auto;
      }

      /* ─── Content block — único clip, flex interno ───
         position: absolute posiciona o bloco no canvas.
         O flex dentro flui normalmente — sem clips filhos. */
      #content {
        position: absolute;
        top: 613px;
        left: 80px;
        width: 920px;
        display: flex;
        flex-direction: column;
        gap: 48px;
      }

      #title {
        font-size: 80px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.15;
        color: var(--enp-text);
      }

      #subtitle {
        font-size: 38px;
        font-weight: 400;
        line-height: 1.6;
        color: var(--enp-gray-60);
      }

      #cta {
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        margin-top: 40px;
        background: var(--enp-cta);
        color: #fff;
        font-size: 38px;
        font-weight: 600;
        padding: 44px 80px;
        border-radius: var(--enp-radius-pill);
      }
    </style>
  </head>

  <body>
    <div data-hf-id="hf-root" id="root" data-composition-id="enp-stories-v2" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <img data-hf-id="hf-logo" id="logo" class="clip" data-start="0" data-duration="6" data-track-index="1" src="shared/assets/logo-colorido-ecommerce-na-pratica.svg" alt="Ecommerce na Prática">

      <!-- Wrapper único — o único clip do bloco de conteúdo -->
      <div data-hf-id="hf-content" id="content" class="clip" data-start="0" data-duration="6" data-track-index="2">
        <h1 data-hf-id="hf-cssn" id="title">Cada fase da sua loja tem um passo claro</h1>

        <p data-hf-id="hf-t4ml" id="subtitle">Do primeiro produto à escala: trilhas estruturadas para você saber exatamente o que fazer — <b data-hf-id="hf-2xih">sem desperdiçar tempo</b> com tentativa e erro.</p>

        <div data-hf-id="hf-gegd" id="cta">Comece agora</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Entrada em cascata — logo → título → subtítulo → CTA
      tl.from("#logo",     { opacity: 0, y: -24, duration: 0.5, ease: "power3.out" }, 0);
      tl.from("#title",    { opacity: 0, y: 40,  duration: 0.6, ease: "power3.out" }, 0.4);
      tl.from("#subtitle", { opacity: 0, y: 24,  duration: 0.5, ease: "power2.out" }, 0.8);
      tl.from("#cta",      { opacity: 0, scale: 0.9, duration: 0.4, ease: "back.out(1.7)" }, 1.3);

      // 2 pulsos suaves no CTA para chamar atenção
      tl.to("#cta", { scale: 1.05, duration: 0.4, ease: "sine.inOut" }, 2.2);
      tl.to("#cta", { scale: 1.00, duration: 0.4, ease: "sine.inOut" }, 2.6);
      tl.to("#cta", { scale: 1.05, duration: 0.4, ease: "sine.inOut" }, 3.1);
      tl.to("#cta", { scale: 1.00, duration: 0.4, ease: "sine.inOut" }, 3.5);

      window.__timelines["enp-stories-v2"] = tl;
    </script>
  </body>
</html>
