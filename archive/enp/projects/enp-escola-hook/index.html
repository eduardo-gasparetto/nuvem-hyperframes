    <style>
      :root {
        --frost: #f4f7fb;
        --white: #ffffff;
        --ink: #313642;
        --muted: #5c6167;
        --meta: #979ba1;
        --line: #bdc0c6;
        --accent: #1076dd;
        --sky: #31b3f9;
        --lime: #cdff07;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--frost);
      }

      body {
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue",
          Arial, sans-serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: var(--frost);
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
        opacity: 0;
      }

      /* ---------- warm-up accent sweep ---------- */

      .warm-bar {
        position: absolute;
        left: 50%;
        top: 140px;
        width: 260px;
        height: 10px;
        margin-left: -130px;
        background: var(--accent);
        border-radius: 6px;
        opacity: 0;
      }

      /* ---------- shared card shell ---------- */

      .card {
        position: absolute;
        left: 56px;
        width: 968px;
        background: var(--white);
        border-radius: 48px;
        box-shadow:
          0 32px 80px -20px rgba(49, 54, 66, 0.22),
          0 8px 24px rgba(49, 54, 66, 0.06);
        display: flex;
        flex-direction: column;
        padding: 72px;
        opacity: 0;
      }

      .icon-chip {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .icon-chip svg {
        width: 44px;
        height: 44px;
      }

      /* ---------- hook scene ---------- */

      #card-hook {
        top: 580px;
        height: 760px;
      }

      .headline-stage {
        position: relative;
        flex: 1;
        margin-top: 56px;
      }

      .scene-block {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
        opacity: 0;
      }

      .line-small {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 16px;
      }

      .line-small .word {
        font-size: 52px;
        font-weight: 400;
        line-height: 1.2;
        color: var(--muted);
        display: inline-block;
      }

      .line-big {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
      }

      .line-big .word {
        font-size: 92px;
        font-weight: 600;
        line-height: 1.12;
        letter-spacing: -0.01em;
        color: var(--ink);
        display: inline-block;
      }

      .line-big .word--brand {
        color: var(--accent);
        position: relative;
      }

      .brand-underline {
        position: absolute;
        left: 0;
        bottom: -8px;
        width: 100%;
        height: 7px;
        background: var(--accent);
        border-radius: 4px;
        transform: scaleX(0);
        transform-origin: 0% 50%;
      }

      .spark {
        position: absolute;
        width: 64px;
        height: 64px;
        right: 30px;
        top: -54px;
        color: var(--accent);
        opacity: 0;
        pointer-events: none;
      }

      .spark svg {
        width: 100%;
        height: 100%;
      }

      .confetti-chip {
        position: absolute;
        border-radius: 12px;
        opacity: 0;
        pointer-events: none;
      }

      .chip-1 {
        left: 6%;
        top: 14%;
        width: 56px;
        height: 56px;
        background: var(--accent);
      }

      .chip-2 {
        left: 78%;
        top: 58%;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--sky);
      }

      .chip-3 {
        left: 68%;
        top: 8%;
        width: 34px;
        height: 34px;
        background: var(--lime);
      }

      .progress {
        display: flex;
        gap: 16px;
        flex-shrink: 0;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--line);
      }

      /* ---------- method panel scene ---------- */

      #card-panel {
        top: 550px;
        height: 820px;
      }

      .panel-header {
        font-size: 44px;
        font-weight: 400;
        color: var(--muted);
        line-height: 1.25;
        max-width: 760px;
        opacity: 0;
      }

      .rows-stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 56px;
        margin-top: 40px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 28px;
        opacity: 0;
      }

      .row-icon {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: #eff1f4;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .row-icon svg {
        width: 36px;
        height: 36px;
        color: var(--accent);
      }

      .row-label {
        flex: 1;
        font-size: 40px;
        font-weight: 600;
        line-height: 1.25;
        color: var(--ink);
        letter-spacing: -0.005em;
      }

      .row-check {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        opacity: 0;
      }

      .row-check svg {
        width: 22px;
        height: 22px;
      }

      /* ---------- CTA scene ---------- */

      #card-cta {
        top: 550px;
        height: 820px;
        align-items: center;
        justify-content: center;
        gap: 40px;
        text-align: center;
      }

      .cta-logo {
        height: 56px;
        opacity: 0;
      }

      .cta-headline {
        font-size: 76px;
        font-weight: 600;
        line-height: 1.14;
        letter-spacing: -0.015em;
        color: var(--ink);
        opacity: 0;
      }

      .cta-button-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cta-glow {
        position: absolute;
        width: 460px;
        height: 140px;
        border-radius: 100px;
        background: var(--sky);
        opacity: 0;
        filter: blur(2px);
      }

      .cta-button {
        position: relative;
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--accent);
        color: var(--white);
        font-size: 40px;
        font-weight: 600;
        padding: 30px 56px;
        border-radius: 100px;
        opacity: 0;
      }

      .cta-button svg {
        width: 32px;
        height: 32px;
      }
    </style>
  </head>

        { sel: "#frag-1", x: -46, y: 26 },
        { sel: "#frag-2", x: 34, y: -22 },
        { sel: "#frag-3", x: 50, y: 30 },
      ];
      FRAGS.forEach(function (f, i) {
        tl.set(f.sel, { opacity: 0, x: f.x, y: f.y, filter: "blur(9px)", color: "#313642" }, 2.45);
        tl.to(
          f.sel,
          { opacity: 1, x: 0, y: 0, filter: "blur(0px)", color: "#1076dd", duration: 0.36, ease: "power3.out" },
          2.5 + i * 0.06,
        );
      });

      tl.set(["#underline-1", "#underline-2", "#underline-3"], { scaleX: 0 }, 2.45);
      tl.to("#underline-1", { scaleX: 1, duration: 0.2, ease: "power2.out" }, 2.92);
      tl.to("#underline-2", { scaleX: 1, duration: 0.2, ease: "power2.out" }, 2.97);
      tl.to("#underline-3", { scaleX: 1, duration: 0.2, ease: "power2.out" }, 3.02);

      tl.set("#spark", { opacity: 0, scale: 0.3, rotation: -20 }, 2.45);
      tl.to("#spark", { opacity: 1, scale: 1, rotation: 0, duration: 0.24, ease: "power3.out" }, 2.88);
      tl.to("#spark", { opacity: 0, duration: 0.2, ease: "power2.in" }, 3.35);
      tl.set("#spark", { opacity: 0 }, 3.6);

      // Hook exits.
      tl.to("#card-hook", { opacity: 0, scale: 1.04, filter: "blur(12px)", duration: 0.3, ease: "power3.in" }, 3.55);
      tl.to("#hook", { opacity: 0, duration: 0.02 }, 3.85);

      /* ---------------- method panel scene ---------------- */
      tl.set("#panel", { opacity: 1 }, 3.6);
      tl.to("#card-panel", {
        keyframes: {
          "0%": { opacity: 1, scale: 1, y: 0, filter: "blur(0px)" },
          "39.5%": { opacity: 0.942, scale: 0.994, y: 11.34 },
          "100%": { opacity: 1, scale: 1, y: 0, filter: "blur(0px)" },
          easeEach: "expo.out"
        },
        duration: 0.46,
        ease: "none"
      }, 3.75);

      tl.set("#panel-header", { opacity: 0, y: 16 }, 3.75);
      tl.to("#panel-header", { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 4.3);

      var ROWS = [
        { row: "#row-1", check: "#check-1", start: 4.7 },
        { row: "#row-2", check: "#check-2", start: 5.3 },
        { row: "#row-3", check: "#check-3", start: 5.9 },
      ];
      ROWS.forEach(function (r) {
        tl.set(r.row, { opacity: 0, y: 24, filter: "blur(6px)" }, r.start);
        tl.to(r.row, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, r.start + 0.02);
        tl.set(r.check, { opacity: 0, scale: 0.5 }, r.start + 0.02);
        tl.to(r.check, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, r.start + 0.32);
      });

      tl.to("#card-panel", { opacity: 0, scale: 0.94, y: -20, filter: "blur(10px)", duration: 0.3, ease: "power3.in" }, 7.65);
      tl.to("#panel", { opacity: 0, duration: 0.02 }, 7.95);

      /* ---------------- CTA scene ---------------- */
      tl.set("#cta", { opacity: 1 }, 7.75);
      tl.set("#card-cta", { opacity: 0, scale: 0.9, y: 32, filter: "blur(10px)", transformOrigin: "50% 50%" }, 7.75);
      tl.to("#card-cta", { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, 7.85);

      tl.set("#cta-logo", { opacity: 0, y: 12 }, 7.85);
      tl.to("#cta-logo", { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, 8.05);

      tl.set("#cta-headline", { opacity: 0, y: 20 }, 7.85);
      tl.to("#cta-headline", { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 8.2);

      tl.set("#cta-button", { opacity: 0, scale: 0.8 }, 7.85);
      tl.to("#cta-button", { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 8.5);

      tl.set("#cta-glow", { opacity: 0, scale: 0.85 }, 8.5);
      tl.to("#cta-glow", { opacity: 0.28, scale: 1.06, duration: 0.32, ease: "sine.out" }, 8.7);
      tl.to("#cta-glow", { opacity: 0, scale: 1.15, duration: 0.36, ease: "sine.in" }, 9.02);

      // Button press feedback — clean settle, no bounce/elastic.
      tl.to("#cta-button", { scale: 0.93, duration: 0.08, ease: "power2.in" }, 9.3);
      tl.to("#cta-button", { scale: 1, duration: 0.16, ease: "power2.out" }, 9.38);

      tl.to({}, { duration: 11.3 }, 0);

      tl.set("#card-panel", { opacity: 0, transformOrigin: "50% 50%" }, 3.6);

      tl.set("#card-panel", { scale: 0.9 }, 3.6);

      tl.set("#card-panel", { y: 40 }, 3.6);

      tl.set("#card-panel", { filter: "blur(12px)" }, 3.6);

      window.__timelines["enp-escola-hook"] = tl;
    </script>
  </body>
</html>
