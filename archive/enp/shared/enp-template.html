<!DOCTYPE html>
<!--
  EnP Template Base — HyperFrames
  ─────────────────────────────────────────────────────────────────────
  Ponto de partida para composições EnP. Copie para projects/<nome>/index.html.

  Modo padrão: institutional_light (Frost + Deep Slate + Button Blue)
  Para mudar: troque data-enp-theme no <html>
    • sem atributo       → institutional_light
    • data-enp-theme="dark"     → institutional_dark
    • data-enp-theme="services" → services

  Paths relativos: corretos para projects/<nome>/index.html → ../../shared/
  ─────────────────────────────────────────────────────────────────────
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">

    <!-- Tokens EnP (self-hosted) -->
    <link rel="stylesheet" href="../../shared/fonts.css">
    <link rel="stylesheet" href="../../shared/enp-tokens.css">

    <!-- GSAP (adapter padrão do HyperFrames) -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: var(--enp-font);
        background: var(--enp-bg);
        color: var(--enp-text);
      }

      /* ── Layout ──
         REGRA: em composições HyperFrames, NUNCA use flex/grid no container
         de clips. class="clip" esconde/mostra elementos pelo tempo — flex
         faz reflow a cada entrada/saída → todos os clips visíveis se sobrepõem
         no centro. TUDO deve ser position: absolute com top/left explícitos. */
      #root {
        width: 1920px;
        height: 1080px;
        position: relative;
      }

      /* Helper: centraliza horizontalmente qualquer bloco */
      .centered {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      /* ── Eyebrow ── */
      #eyebrow {
        top: 300px;
        font-size: var(--enp-v-eyebrow);
        font-weight: 600;
        letter-spacing: var(--enp-v-track-eyebrow);
        text-transform: uppercase;
        color: var(--enp-cta);
      }

      /* ── Logo ── */
      #logo {
        top: 350px;
        width: 120px;
        height: auto;
      }

      /* ── Título ── */
      #title {
        top: 490px;
        font-size: var(--enp-v-h1);
        font-weight: 600;
        letter-spacing: var(--enp-v-track-h1);
        line-height: var(--enp-leading-h1);
        color: var(--enp-text);
        text-align: center;
        width: 1400px;
        white-space: normal;
      }

      /* ── Subtítulo ── */
      #subtitle {
        top: 660px;
        font-size: var(--enp-v-lead);
        font-weight: 400;
        line-height: var(--enp-leading-body);
        color: var(--enp-gray-60);
        text-align: center;
        width: 1200px;
        white-space: normal;
      }

      /* ── CTA pill ── */
      #cta {
        top: 780px;
        display: inline-flex;
        align-items: center;
        gap: var(--enp-space-4);
        background: var(--enp-cta);
        color: #fff;
        font-size: var(--enp-v-body);
        font-weight: 600;
        padding: 20px 48px;
        border-radius: var(--enp-radius-pill);
      }

      /* ── Acento decorativo (linha Lime) ── */
      #accent-line {
        top: 990px;
        width: 160px;
        height: 6px;
        background: var(--enp-lime);
        border-radius: var(--enp-radius-sm);
      }
    </style>
  </head>

  <body>
    <!--
      Composição raiz.
      • data-composition-id: deve ser único por projeto
      • data-duration: duração total em segundos
      • data-width / data-height: dimensões do canvas
    -->
    <div
      data-hf-id="hf-root"
      id="root"
      data-composition-id="enp-main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <span data-hf-id="hf-eyebrow" id="eyebrow" class="clip centered" data-start="0"   data-duration="8"   data-track-index="1">Ecommerce na Prática</span>

      <img  data-hf-id="hf-logo"    id="logo"    class="clip centered" data-start="0.3" data-duration="7.7" data-track-index="2" src="../../shared/assets/simbolo-azul-ecommerce-na-pratica.svg" alt="EnP">

      <h1   data-hf-id="hf-title"   id="title"   class="clip centered" data-start="0.6" data-duration="7.4" data-track-index="3">Título da composição</h1>

      <p    data-hf-id="hf-subtitle" id="subtitle" class="clip centered" data-start="1.0" data-duration="7.0" data-track-index="4">Descrição ou chamada de apoio — substitua este texto.</p>

      <div  data-hf-id="hf-cta"     id="cta"     class="clip centered" data-start="1.4" data-duration="6.6" data-track-index="5">Saiba mais →</div>

      <div  data-hf-id="hf-accent"  id="accent-line" class="clip centered" data-start="0" data-duration="8" data-track-index="6"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Entrance — transform + opacity apenas (regra EnP)
      // Curvas: ease-out-expo = power4.out no GSAP (aproximação)

      // Eyebrow: fade simples rápido
      tl.from("#eyebrow", { opacity: 0, duration: 0.3, ease: "power2.out" }, 0);

      // Logo: sobe suave
      tl.from("#logo", { opacity: 0, y: -20, duration: 0.5, ease: "power3.out" }, 0.3);

      // Título: sobe com mais peso
      tl.from("#title", { opacity: 0, y: 40, duration: 0.7, ease: "power3.out" }, 0.6);

      // Subtítulo: segue o título
      tl.from("#subtitle", { opacity: 0, y: 24, duration: 0.6, ease: "power2.out" }, 1.0);

      // CTA: pop leve (scale, não bounce)
      tl.from("#cta", { opacity: 0, scale: 0.92, duration: 0.4, ease: "power2.out" }, 1.4);

      // Linha: cresce da esquerda
      tl.from("#accent-line", { scaleX: 0, transformOrigin: "left center", duration: 0.6, ease: "power3.out" }, 0.2);

      window.__timelines["enp-main"] = tl;
    </script>
  </body>
</html>
